<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại buổi này
 *       Enter = hết buổi sáng thì chèo xuồng về quán (cảnh chuyển, Enter lần nữa để bỏ qua) · N = ngày mới.
 * Mọi hiệu ứng (sóng, bọt, cá bơi lượn, cảnh chuyển) chỉ ở client, không đi vào mô phỏng / headless.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.mode : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
let showPressLog = true;
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  console.debug("[phím] xuống", k, "tick", snap && snap.tick, "mode", snap && snap.mode);
  if (k === "l") { showPressLog = !showPressLog; return; }
  if (k === "enter") {
    if (cut) cut.skip = true;
    else if (snap && snap.can_continue) startCutscene();
    return;
  }
  if (cut) return;                                   // đang chiếu cảnh chuyển: khóa điều khiển
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); fx.reset(); }
  else if (k === "n") { fetch("/new-day", { method: "POST" }); lastSent = ""; down.clear(); fx.reset(); fadeIn = 1; }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (k === "e" || k === " ") console.debug("[phím] nhả", k, "tick", snap && snap.tick);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

const IMAGES = {};
function getImage(src) {
  if (!IMAGES[src]) {
    const img = new Image();
    img.src = src;
    IMAGES[src] = img;
  }
  return IMAGES[src];
}
const RESTAURANT_ASSETS = {
  // Bếp & Bàn chính
  stove: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_stove_commercial_six_burner_01.png",
  table: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_table_dining_round_four_01.png",
  chair: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_chair_dining_padded_01.png",
  
  // Món ăn
  ca_loc_nuong_trui: "/assets/Restaurant Assets Pack/food/r_1634.png",
  goi_bong_sung: "/assets/Restaurant Assets Pack/food/r_1636.png",
  lau_ca_linh_dien_dien: "/assets/Restaurant Assets Pack/food/r_1654.png",

  // Khu vực Bếp (Kitchen Fixtures & Props)
  prep_counter: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_open_kitchen_display_counter_01.png",
  griddle: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_griddle_flat_top_01.png",
  deep_fryer: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_deep_fryer_double_01.png",
  stock_pot: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_stock_pot_large_01.png",
  pans_pair: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_pans_commercial_pair_01.png",
  cutting_board: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_cutting_board_vegetables_01.png",
  plates_tower: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_plates_tower_01.png",
  glass_rack: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_glass_rack_hanging_01.png",
  divider: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_divider_screen_folding_01.png",

  // Khu vực Bàn ăn & Trang trí (Dining & Decor)
  table_square: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_table_dining_square_four_01.png",
  table_family: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_table_family_long_01.png",
  table_window: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_table_window_two_01.png",
  bench: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_bench_waiting_01.png",
  host_stand: "/assets/Restaurant Assets Pack/Tiles/RestaurantFixtures/fooddrink_restaurant_fixtures_host_stand_podium_01.png",
  menu_easel: "/assets/Restaurant Assets Pack/Tiles/CafeFixtures/fooddrink_cafe_fixtures_menu_board_easel_blank_01.png",
  drink_cart: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_drink_cart_wheeled_01.png",
  condiment: "/assets/Restaurant Assets Pack/Tiles/RestaurantProps/fooddrink_restaurant_props_condiment_rack_01.png",
  lamp: "/assets/Restaurant Assets Pack/Tiles/CafeProps/fooddrink_cafe_props_lamp_floor_rattan_01.png",
  string_lights: "/assets/Restaurant Assets Pack/Tiles/CafeProps/fooddrink_cafe_props_string_lights_warm_segment_01.png",
  flower_vase: "/assets/Restaurant Assets Pack/Tiles/CafeProps/fooddrink_cafe_props_vase_single_flower_01.png",

  // Thợ lặn Út Sen (Gather Mode)
  diver_swim: "/assets/Nền sông và nhân vật/PNG/player/player-swiming.png",
  diver_idle: "/assets/Nền sông và nhân vật/PNG/player/player-idle.png",
  diver_fast: "/assets/Nền sông và nhân vật/PNG/player/player-fast.png",
  diver_hurt: "/assets/Nền sông và nhân vật/PNG/player/player-hurt.png",
  diver_rush: "/assets/Nền sông và nhân vật/PNG/player/player-rush.png",
};

function drawSprite(key, x, y, w, h, fallbackFn) {
  const src = RESTAURANT_ASSETS[key];
  if (src) {
    const img = getImage(src);
    if (img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x, y, w, h);
      return true;
    }
  }
  if (fallbackFn) fallbackFn();
  return false;
}

let playerLastDirQuan = 0;
let playerLastPosQuan = null;
function drawPixelCharacter(charIndex, dirRow, frameCol, destX, destY, destW, destH) {
  const sheet = getImage("/assets/Pixel Art People/Pixel Art People Sample Sheet.png");
  if (sheet.complete && sheet.naturalWidth > 0) {
    const charX = (charIndex % 4) * 96;
    const charY = Math.floor(charIndex / 4) * 128;
    const srcX = charX + frameCol * 32;
    const srcY = charY + dirRow * 32;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sheet, srcX, srcY, 32, 32, destX, destY, destW, destH);
    ctx.imageSmoothingEnabled = true;
    return true;
  }
  return false;
}

function drawDiver(p, px, py, s, size = 1.05 * s) {
  let spriteKey = "diver_idle";
  let numFrames = 6;
  const speed = p.vel ? Math.hypot(p.vel[0], p.vel[1]) : 0;
  const isHurt = p.invuln_ticks > 0;

  if (isHurt) {
    spriteKey = "diver_hurt";
    numFrames = 5;
  } else if (speed > 1.2) {
    spriteKey = "diver_fast";
    numFrames = 5;
  } else if (speed > 0.05) {
    spriteKey = "diver_swim";
    numFrames = 7;
  } else {
    spriteKey = "diver_idle";
    numFrames = 6;
  }

  const src = RESTAURANT_ASSETS[spriteKey];
  if (!src) return false;
  const img = getImage(src);
  if (!img.complete || img.naturalWidth <= 0) return false;

  const frameIdx = Math.floor(snap.tick / 6) % numFrames;
  const frameW = 80, frameH = 80;
  const sx = frameIdx * frameW;
  const heading = (p.heading_deg || 0) % 360;
  const facingLeft = heading > 90 && heading < 270;

  ctx.save();
  ctx.translate(px, py);
  if (facingLeft) {
    ctx.scale(-1, 1);
  }
  const rotRad = facingLeft ? ((180 - heading) * Math.PI) / 180 : (heading * Math.PI) / 180;
  ctx.rotate(rotRad * 0.4);

  const dw = size, dh = size;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, sx, 0, frameW, frameH, -dw / 2, -dh / 2, dw, dh);
  ctx.imageSmoothingEnabled = true;
  ctx.restore();
  return true;
}

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}

// ===================== CẢNH SÁNG: LẶN & HÁI =====================
// Đồ họa sông: "Underwater Diving" của Luis Zuno @ansimuz (public domain) — assets/Nền sông và nhân vật/.
// Cá linh: SpearFishing Assets Pack (Fish3 Grey). Mọi chuyển động trang trí dùng đồng hồ client, KHÔNG vào mô phỏng.
const RIVER_DIR = "/assets/Nền sông và nhân vật/PNG/";
const SF_DIR = "/assets/SpearFishing Assets Pack/Sprites/";
const RIVER_ASSETS = {
  bg: RIVER_DIR + "environment/background.png",
  mid: RIVER_DIR + "environment/midground.png",
  props: RIVER_DIR + "environment/props.png",
  tiles: RIVER_DIR + "environment/tiles.png",
  bubbles: RIVER_DIR + "FX/bubbles.png",
  fishLoc: RIVER_DIR + "enemies/fish-big.png",
  fishLinh: SF_DIR + "Fish3 - 32x16/Grey.png",
};
// Vùng cắt trong atlas (đo theo kênh alpha của ảnh gốc).
const PROP = { bush: [434, 332, 46, 51], coral: [514, 327, 48, 56], weed: [614, 317, 52, 67],
               rock: [49, 95, 85, 98], rock2: [33, 334, 85, 98] };
const FLOOR_TILE = [16, 108, 176, 68];
const MID_CROP = [0, 300, 960, 212];
const DISH_NAME = { ca_loc_nuong_trui: "cá lóc nướng trui", goi_bong_sung: "gỏi bông súng", lau_ca_linh_dien_dien: "lẩu cá linh điên điển" };
const REASON_VI = { docked: "Cập bến an toàn", time: "Hết giờ", fainted: "Ngất xỉu", error: "Lỗi luật", tick_limit: "Dừng" };
let playerScreen = null;   // vị trí màn hình của người chơi (để thông báo nổi bám theo)

function ready(src) { const im = getImage(src); return im.complete && im.naturalWidth > 0 ? im : null; }
function blit(src, r, dx, dy, dw, dh) {
  const im = ready(src);
  if (!im) return false;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(im, r[0], r[1], r[2], r[3], dx, dy, dw, dh);
  return true;
}
function hashId(id) { let v = 0; for (const ch of String(id)) v = (v * 31 + ch.charCodeAt(0)) >>> 0; return v; }
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (k) => 1 - (1 - k) * (1 - k);
function mixColor(c1, c2, k) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = (sh) => Math.round(lerp((a >> sh) & 255, (b >> sh) & 255, k));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function countItems(list) { const c = {}; (list || []).forEach((k) => (c[k] = (c[k] || 0) + 1)); return c; }
function itemsText(list) {
  const c = countItems(list), ks = Object.keys(c);
  return ks.length ? ks.map((k) => (KIND_NAME[k] || k) + " ×" + c[k]).join(", ") : "(giỏ trống)";
}

// ---------- hình nhỏ dùng chung ----------
function drawLotus(x, y, r) {
  ctx.save(); ctx.translate(x, y);
  for (let i = 0; i < 6; i++) {
    ctx.save(); ctx.rotate((i - 2.5) * 0.42);
    ctx.fillStyle = i % 2 ? "#f6b3cb" : "#e8799c";
    ctx.beginPath(); ctx.ellipse(0, -r * 0.55, r * 0.28, r * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = "#ffd86b"; ctx.beginPath(); ctx.arc(0, -r * 0.12, r * 0.18, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawSesbania(x, y, r) {
  for (const [a, b] of [[0, 0], [-0.7, 0.35], [0.7, 0.3], [-0.3, -0.6], [0.4, -0.55]]) {
    ctx.fillStyle = "#f2c230"; ctx.beginPath(); ctx.ellipse(x + a * r, y + b * r, r * 0.38, r * 0.25, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#d98e14"; ctx.beginPath(); ctx.arc(x + a * r + r * 0.12, y + b * r, r * 0.11, 0, Math.PI * 2); ctx.fill();
  }
}
function drawItemIcon(kind, x, y, sz) {   // (x, y) là tâm
  if (kind === "ca_loc" && blit(RIVER_ASSETS.fishLoc, [0, 0, 54, 49], x - sz / 2, y - sz * 0.45, sz, sz * 0.9)) return;
  if (kind === "ca_linh" && blit(RIVER_ASSETS.fishLinh, [0, 0, 32, 16], x - sz / 2, y - sz / 4, sz, sz / 2)) return;
  if (kind === "bong_sung") { drawLotus(x, y + sz * 0.15, sz * 0.45); return; }
  if (kind === "bong_dien_dien") { drawSesbania(x, y, sz * 0.38); return; }
  ctx.fillStyle = kc(kind); ctx.beginPath(); ctx.arc(x, y, sz * 0.35, 0, Math.PI * 2); ctx.fill();
}
function drawNipa(x, y, sc, col) {   // bụi dừa nước
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, sc * 0.16); ctx.lineCap = "round";
  for (let k = -3; k <= 3; k++) {
    const a = -Math.PI / 2 + k * 0.33;
    ctx.beginPath(); ctx.moveTo(x, y + sc * 0.6);
    ctx.quadraticCurveTo(x + Math.cos(a) * sc * 1.2, y + Math.sin(a) * sc * 1.5,
                         x + Math.cos(a) * sc * 2.1, y + Math.sin(a) * sc * 1.1 + sc * 0.8);
    ctx.stroke();
  }
  ctx.lineCap = "butt";
}
function drawStiltHouse(x, waterY, s, lit) {   // nhà sàn ven sông
  const wd = 4.2 * s, hh = 1.9 * s, lift = 1.0 * s;
  ctx.fillStyle = "#4f3d30";
  for (const f of [0.08, 0.46, 0.86]) ctx.fillRect(x + wd * f, waterY - lift, Math.max(2, 0.16 * s), lift + 0.3 * s);
  ctx.fillStyle = "#8a6a4d"; ctx.fillRect(x, waterY - lift - hh, wd, hh);
  ctx.fillStyle = "#6e4f37"; ctx.fillRect(x - 0.2 * s, waterY - lift - 0.25 * s, wd + 0.4 * s, 0.25 * s);
  ctx.fillStyle = "#9a5b3c";
  ctx.beginPath(); ctx.moveTo(x - 0.6 * s, waterY - lift - hh); ctx.lineTo(x + wd / 2, waterY - lift - hh - 1.3 * s);
  ctx.lineTo(x + wd + 0.6 * s, waterY - lift - hh); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#3b2a1e"; ctx.fillRect(x + wd * 0.36, waterY - lift - hh * 0.78, wd * 0.22, hh * 0.5);
  if (lit > 0) { ctx.fillStyle = `rgba(255,200,110,${lit})`; ctx.fillRect(x + wd * 0.36, waterY - lift - hh * 0.78, wd * 0.22, hh * 0.5); }
}
function drawBoat(cx, waterY, len) {   // xuồng ba lá: thon dài, mũi và lái cong lên
  const h = len * 0.075, L = len / 2;
  ctx.fillStyle = "#3f2a1c";
  ctx.beginPath();
  ctx.moveTo(cx - L, waterY - h * 2.0);                                    // lái
  ctx.quadraticCurveTo(cx - L * 0.8, waterY + h * 0.9, cx - L * 0.45, waterY + h * 0.9);
  ctx.lineTo(cx + L * 0.45, waterY + h * 0.9);
  ctx.quadraticCurveTo(cx + L * 0.8, waterY + h * 0.9, cx + L, waterY - h * 2.0);   // mũi
  ctx.lineTo(cx + L * 0.86, waterY - h * 0.8); ctx.lineTo(cx - L * 0.86, waterY - h * 0.8); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#a8743f"; ctx.lineWidth = Math.max(1, h * 0.4);
  ctx.beginPath(); ctx.moveTo(cx - L * 0.9, waterY - h * 1.0); ctx.lineTo(cx + L * 0.9, waterY - h * 1.0); ctx.stroke();
  ctx.fillStyle = "rgba(255,240,210,.18)"; ctx.fillRect(cx - L * 0.7, waterY + h * 1.1, L * 1.4, 2);   // vệt nước
}

// ---------- các lớp của cảnh sáng ----------
function drawRiverSky(w, top, oy, s, sx, t) {
  const sky = ctx.createLinearGradient(0, top, 0, oy);
  sky.addColorStop(0, "#efae7b"); sky.addColorStop(0.6, "#f7d6a6"); sky.addColorStop(1, "#fbe9c8");
  ctx.fillStyle = sky; ctx.fillRect(0, top, w, oy - top);
  const sunX = sx(80), sunY = oy - (oy - top) * 0.58;
  const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, (oy - top) * 1.1);
  glow.addColorStop(0, "rgba(255,236,170,.9)"); glow.addColorStop(1, "rgba(255,236,170,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, top, w, oy - top);
  ctx.fillStyle = "#fff1c1"; ctx.beginPath(); ctx.arc(sunX, sunY, Math.max(8, 1.5 * s), 0, Math.PI * 2); ctx.fill();
  const bank = oy - 0.1 * s;

let midCache = null;
function midLayer(mh) {   // tầng đá giữa, mép trên mờ dần (tránh đường cắt ngang cứng); cache theo kích thước
  mh = Math.round(mh);
  if (midCache && midCache.height === mh) return midCache;
  const im = ready(RIVER_ASSETS.mid);
  if (!im) return null;
  const c = document.createElement("canvas"), g2 = c.getContext("2d");
  c.height = mh; c.width = Math.round(MID_CROP[2] * mh / MID_CROP[3]);
  g2.imageSmoothingEnabled = false;
  g2.drawImage(im, MID_CROP[0], MID_CROP[1], MID_CROP[2], MID_CROP[3], 0, 0, c.width, c.height);
  const fade = g2.createLinearGradient(0, 0, 0, mh * 0.45);
  fade.addColorStop(0, "rgba(0,0,0,0)"); fade.addColorStop(1, "rgba(0,0,0,1)");

function drawUnderwater(w, oy, floorY, bottomY, s, sx, sy, D, camX, t) {

  const bg = ready(RIVER_ASSETS.bg);
  if (bg) {
    const k = riverH / 256, tw = 288 * k, off = -((((camX * 80 + t * 6) % tw) + tw) % tw);
    ctx.imageSmoothingEnabled = false;

  } else { ctx.fillStyle = "#24506a"; ctx.fillRect(0, oy, w, riverH); }
  // nước phù sa: đục màu đất gần mặt, xanh thẫm ở đáy
  const g = ctx.createLinearGradient(0, oy, 0, bottomY);
  g.addColorStop(0, "rgba(150,118,62,.62)"); g.addColorStop(0.35, "rgba(96,102,62,.42)"); g.addColorStop(1, "rgba(6,22,30,.55)");
  ctx.fillStyle = g; ctx.fillRect(0, oy, w, riverH);
  // tia nắng xiên xuống
  for (let i = 0; i < 6; i++) {
    const x = sx(6 + i * 17 + Math.sin(t * 0.25 + i * 1.7) * 3), yEnd = sy(D * 0.75);
    const a = 0.07 + 0.04 * Math.sin(t * 0.6 + i);
    const rg = ctx.createLinearGradient(0, oy, 0, yEnd);
    rg.addColorStop(0, `rgba(255,236,190,${a})`); rg.addColorStop(1, "rgba(255,236,190,0)");
    ctx.fillStyle = rg; ctx.beginPath();
    ctx.moveTo(x - 0.8 * s, oy); ctx.lineTo(x + 0.8 * s, oy); ctx.lineTo(x + 4.5 * s, yEnd); ctx.lineTo(x + 1.5 * s, yEnd);
    ctx.closePath(); ctx.fill();
  }
  // đá tầng giữa, trôi nhẹ theo người chơi
  const mid = midLayer(9 * s);
  if (mid) {
    const mh = mid.height, mw = mid.width, off = -((((camX * 160) % mw) + mw) % mw);
    ctx.globalAlpha = 0.85;

  // rong, san hô, đá (rong lay theo dòng nước)
  const DECOR = [["weed", 6], ["bush", 13], ["coral", 22], ["rock", 31], ["weed", 41], ["coral", 50],
                 ["bush", 57], ["rock2", 68], ["weed", 76], ["coral", 85], ["bush", 93]];
  for (const [kd, x] of DECOR) {
    const r = PROP[kd], big = kd.startsWith("rock"), ph = (big ? 4.2 : 2.6) * s, pw = r[2] * ph / r[3];
    ctx.save(); ctx.translate(sx(x), floorY - 0.1 * s);

    const fr = k < 0.85 ? 0 : Math.min(3, Math.floor(((k - 0.85) / 0.15) * 4));

}

function drawSurfaceLine(w, oy, s, t) {
  for (const [dy, a, lw] of [[0, 0.85, 2], [0.35, 0.25, 1]]) {
    ctx.strokeStyle = `rgba(255,240,210,${a})`; ctx.lineWidth = lw; ctx.beginPath();

function drawDock(meta, s, sx, sy, t) {

function drawFishSchools(meta, p, underwater, s, sx, sy, t) {

function gatherHint(meta, p, underwater) {
  if (!p || underwater) return null;
  const dp = meta.dock_pos || [2, 0];
  if (Math.hypot(p.pos[0] - dp[0], p.pos[1] - dp[1]) <= (meta.dock_radius || 3)) return "[E] cập bến";
  const r = meta.interact_radius || 2;
  const ok = (snap.nodes || []).some((n) => n.ready !== false && Math.hypot(p.pos[0] - n.pos[0], p.pos[1] - n.pos[1]) <= r);
  return ok ? "[E] hái" : null;
}

function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 7, top = 64, bottom = 64;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 2)));
  const spare = Math.max(0, h - top - bottom - (D + SKY + 2) * s);   // màn hình cao hơn cần: dồn phần dư cho bầu trời

  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const t = performance.now() / 1000;
  const p = snap.player;
  const underwater = p ? (p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface) : false;
  const camX = p ? p.pos[0] / X - 0.5 : 0;

  ctx.fillStyle = "#132029"; ctx.fillRect(0, top, w, h - top);

  drawSurfaceLine(w, oy, s, t);

  drawNodes(meta, s, sx, sy, t);
  drawFishSchools(meta, p, underwater, s, sx, sy, t);

  playerScreen = null;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    playerScreen = { x: px, y: py };
    if (underwater) {   // bọt thở
      for (let i = 0; i < 3; i++) {
        const k = (t * 0.8 + i / 3) % 1;
        blit(RIVER_ASSETS.bubbles, [0, 0, 23, 40], px + 0.5 * s + Math.sin(t * 3 + i) * 0.2 * s, py - 1.2 * s - k * 2.5 * s, 0.5 * s, 0.9 * s);
      }
    }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      if (!drawDiver(p, px, py, s, Math.max(56, 4.6 * s))) {
        ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      }

  }

    vg.addColorStop(0, "rgba(120,0,0,0)"); vg.addColorStop(1, `rgba(160,10,10,${0.25 + 0.15 * Math.sin(t * 6)})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);
  }

  // HUD trên
  ctx.fillStyle = "rgba(10,24,30,.9)"; ctx.fillRect(0, 0, w, top);
  text("☀ Buổi sáng · Lặn & Hái", 14, 22, { size: 13, color: "#ffd59a" });
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 50, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(130, 32, 240, 20, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 386, 50, { size: 24, color: "#ff6b81" });
  }
  if (p && p.pos) text(underwater ? `độ sâu ${p.pos[1].toFixed(1)} m` : "trên mặt nước", 480, 48, { size: 13, color: "#9fb3c0" });
  if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 600, 48, { size: 12, color: "#9fb3c0" });

  // giỏ dưới

  if (snap.hold && snap.hold_capacity) {

         { size: 12, color: full ? "#ffab91" : "#cfd8dc" });
  }
  text("WASD bơi · E hái / cập bến · Space bắt cá · R lặn lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function eventMessage(e) {

  switch (e.name) {
    case "gather": return { text: `+${d.count || 1} ${nm(d.kind)}`, color: "#ffe082" };
    case "fish_caught": return { text: `+${d.count || 1} ${nm(d.kind)}`, color: "#80deea" };
    case "hold_full": return { text: `Giỏ đầy! (cần ${d.needed ?? "?"} chỗ, còn ${d.free ?? "?"})`, color: "#ffab91" };
    case "oxygen_empty": return { text: "Hết oxy! Mau nổi lên", color: "#ff8a80" };
    case "choke": return { text: "Ngạt nước! −1 ♥", color: "#ff5252" };
    case "faint": return { text: "Út Sen ngất xỉu…", color: "#ff5252" };
    case "surface": return { text: "Hít một hơi", color: "#e0f7fa", small: true };
    case "customer_arrived": return { text: "Khách gọi: " + (DISH_NAME[d.dish_id] || d.dish_id || "món"), color: "#c5e1a5" };
    case "no_dish": return { text: "Không đủ nguyên liệu cho món nào!", color: "#ffab91" };
    case "customer_left": return d.reason === "closing" ? null : { text: "Khách bỏ về! −0.5 ⭐", color: "#ff8a80" };
    case "cook_started": return { text: "Bắt đầu nấu", color: "#ffcc80" };
    case "dish_ready": return { text: "Món chín rồi!", color: "#a5d6a7" };
    case "dish_picked": return { text: "Bưng món lên", color: "#fff59d" };
    case "served": return { text: "Dọn món cho khách", color: "#a5d6a7" };
    case "paid": return { text: `+${d.amount ?? ""}k`, color: "#ffd54f" };
    default: return null;
  }
}
const fx = {
  seen: new Set(), primed: false, items: [],
  reset() { this.seen = new Set(); this.primed = false; this.items = []; },
  ingest() {
    const fresh = [];
    for (const e of (snap.events || [])) {
      const key = snap.mode + "|" + e.tick + "|" + e.name + "|" + JSON.stringify(e.data);
      if (!this.seen.has(key)) { this.seen.add(key); fresh.push(e); }
    }
    if (!this.primed) { this.primed = true; return; }   // mở trang giữa chừng: không phát lại sự kiện cũ
    const now = performance.now();
    for (const e of fresh) { const m = eventMessage(e); if (m) this.items.push(Object.assign(m, { born: now })); }
    if (this.seen.size > 500) this.seen = new Set([...this.seen].slice(-250));
  },
  draw(w) {
    const now = performance.now(), LIFE = 1600;
    this.items = this.items.filter((it) => now - it.born < LIFE).slice(-5);
    const a0 = snap.mode === "gather" && playerScreen ? playerScreen : { x: w / 2, y: 230 };
    this.items.forEach((it, i) => {
      const age = (now - it.born) / LIFE, y = a0.y - 44 - age * 46 - (this.items.length - 1 - i) * 19;

    drawSprite("condiment", sx(tb.pos[0]) - 0.25 * s, sy(tb.pos[1]) - 0.25 * s, 0.5 * s, 0.5 * s);

    // Badge nhãn bàn
    ctx.fillStyle = isNearby ? "rgba(46, 125, 50, 0.85)" : "rgba(0,0,0,0.65)";
    ctx.fillRect(sx(tb.pos[0]) - 0.8 * s, sy(tb.pos[1]) + 0.8 * s, 1.6 * s, 16);
    text(tb.id + (isNearby ? " [Bấm E]" : ""), sx(tb.pos[0]), sy(tb.pos[1]) + 0.8 * s + 12, { size: 11, align: "center", color: "#a5d6a7" });

    // Khách hàng ngồi tại bàn
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.35 * s;
      const charIdx = (c.id.charCodeAt(c.id.length - 1) % 6) + 1;

      // Hoạt ảnh khách: ăn thì nhai đầu gật gù, chờ thì thở nhẹ và thỉnh thoảng liếc nhìn
      let custBobY = 0;
      let custCol = 1;
      let custDir = 0; // nhìn xuống phía bàn ăn

      if (c.state === "eating") {
        const chewPhase = Math.floor(snap.tick / 7) % 4;
        custBobY = Math.abs(Math.sin(snap.tick * 0.3)) * (0.05 * s);
        custCol = (chewPhase === 1 || chewPhase === 3) ? 0 : 1;
      } else {
        custBobY = Math.sin((snap.tick + charIdx * 15) * 0.08) * (0.02 * s);
        const glance = Math.floor(snap.tick / 80) % 6;
        if (glance === 2) custDir = 1; // liếc trái
        else if (glance === 4) custDir = 2; // liếc phải
      }

      const cW = 0.8 * s, cH = 0.9 * s;
      const drawnCust = drawPixelCharacter(charIdx, custDir, custCol, cx - cW / 2, cy - cH * 0.7 + custBobY, cW, cH);
      if (!drawnCust) {
        ctx.fillStyle = c.state === "eating" ? "#4caf50" : "#f06292";
        ctx.beginPath(); ctx.arc(cx, cy, 0.35 * s, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
        text(c.state === "eating" ? "😋" : "👤", cx, cy + 4, { size: 12, align: "center" });
      }

      // Bong bóng biểu tượng món muốn ăn / đang ăn
      const dishImg = RESTAURANT_ASSETS[c.dish_id];
      if (dishImg) {
        drawSprite(c.dish_id, cx - 0.35 * s, cy - 1.25 * s, 0.7 * s, 0.7 * s);
      }
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(cx - 0.7 * s, cy - 0.55 * s, 1.4 * s, 13);
      text(c.dish_id || "?", cx, cy - 0.55 * s + 10, { size: 10, align: "center", color: "#fff" });

      if (c.patience_ticks_left !== undefined) {
        bar(cx - 0.7 * s, cy + 0.45 * s, 1.4 * s, 5, c.patience_ticks_left / patMax, "#e57373", Math.ceil(c.patience_ticks_left / 60) + "s");
      }
    }
  });

  // 9. Người chơi (Út Sen)
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.beginPath(); ctx.ellipse(px, py + 0.35 * s, 0.38 * s, 0.16 * s, 0, 0, Math.PI * 2); ctx.fill();

    if (meta.interact_radius) {
      ctx.strokeStyle = "rgba(255,255,255,0.4)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }

    // Hướng nhìn và hoạt ảnh quay người / bước đi của Út Sen từ Pixel Art People
    let vx = p.vel ? p.vel[0] : 0;
    let vz = p.vel ? p.vel[1] : 0;

    // Nếu không có vel từ server hoặc đang đứng yên, kiểm tra độ dời toạ độ thực tế
    if (playerLastPosQuan) {
      const ddx = p.pos[0] - playerLastPosQuan[0];
      const ddz = p.pos[1] - playerLastPosQuan[1];
      if (Math.hypot(ddx, ddz) > 0.002) {
        vx = ddx;
        vz = ddz;
      }
    }
    playerLastPosQuan = [p.pos[0], p.pos[1]];

    // Phản hồi quay hướng ngay lập tức khi người chơi bấm phím
    if (down.has("left")) vx = -1;
    else if (down.has("right")) vx = 1;
    if (down.has("up")) vz = 1;
    else if (down.has("down")) vz = -1;

    const speed = Math.hypot(vx, vz);
    if (speed > 0.005) {
      if (Math.abs(vx) >= Math.abs(vz)) {
        playerLastDirQuan = vx > 0 ? 2 : 1; // 2: Phải (East), 1: Trái (West)
      } else {
        playerLastDirQuan = vz > 0 ? 3 : 0; // 3: Lên/Bắc (North/Back), 0: Xuống/Nam (South/Front)
      }
    }
    const dirRow = playerLastDirQuan;

    // Chu kỳ bước chân cell animation [Idle, Step1, Idle, Step2]
    let frameCol = 1;
    let bobY = 0;
    if (speed > 0.05) {
      const animStep = Math.floor(snap.tick / 6) % 4;
      frameCol = [1, 0, 1, 2][animStep];
      bobY = (frameCol === 0 || frameCol === 2) ? -0.04 * s : 0; // nhún chân khi bước
    } else {
      bobY = Math.sin(snap.tick * 0.08) * (0.015 * s); // thở nhẹ khi đứng yên
    }

    const spriteW = 0.85 * s;
    const spriteH = 0.95 * s;
    const drawnPlayer = drawPixelCharacter(2, dirRow, frameCol, px - spriteW / 2, py - spriteH * 0.75 + bobY, spriteW, spriteH);
    if (!drawnPlayer) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.4 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#ffe082"; ctx.beginPath(); ctx.arc(px, py - 0.1 * s, 0.25 * s, Math.PI, 0); ctx.fill();
    }
    text("Út Sen", px, py + 0.65 * s, { size: 11, align: "center", color: "#fff" });

    // Món đang bưng trên tay
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      const dishImg = RESTAURANT_ASSETS[hand];
      if (dishImg) {
        drawSprite(hand, px - 0.35 * s, py - 1.25 * s + bobY, 0.7 * s, 0.7 * s);
      }
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(px - 0.8 * s, py - 1.35 * s + bobY, 1.6 * s, 14);
      text("🍲 " + hand, px, py - 1.35 * s + bobY + 11, { size: 10, align: "center", color: "#fff" });
    }
  }

  // 10. HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20, color: "#ffd54f" });
  text(`Tiền: ${snap.money ?? 0}k · Uy tín: ${(snap.reputation ?? 0).toFixed(1)} ⭐ · Điểm: ${snap.score ?? 0}`, 120, 28, { size: 16, color: "#fff" });
  const stock = snap.stock ? Object.keys(snap.stock).map((k) => (KIND_NAME[k] || k) + "×" + snap.stock[k]).join(", ") : "";
  text("Kho sẵn có: " + (stock || "(trống)"), 14, 52, { size: 13, color: "#b0bec5" });
  text("WASD/mũi tên di chuyển · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// Log nút từ máy chủ: mỗi lần E/Space được luật nhận ở tick nào, ngữ cảnh, sự kiện sinh ra. L = ẩn/hiện.
let lastPressLogged = "";
// Bấm mà luật không làm gì (không sinh sự kiện): giải thích cho người chơi vì sao. Chỉ ở client.
function pressHint(r) {
  const c = r.context || "";
  if (r.mode === "quan") {
    if (c.startsWith("không có bếp/bàn")) return "Lại gần bếp hoặc bàn hơn (≤ 1.5 m)";
    if (c.includes("bàn trống")) return "Bàn này chưa có khách";
    if (c.includes("mục tiêu bàn") && c.includes("tay trống")) return "Tay trống — ra bếp nấu rồi bưng món ra bàn";
    if (c.includes("mục tiêu bàn")) return "Món trên tay không phải món khách này gọi";
    if (c.includes("bếp cooking")) return "Bếp đang nấu, chờ món chín";
    if (c.includes("mục tiêu bếp") && !c.includes("tay trống")) return "Đang bưng món — mang ra bàn trước";
    if (c.includes("bếp idle")) return "Chưa có đơn nào cần nấu";
    return "Không làm được gì ở đây";
  }
  if (r.keys.includes("Space")) return c.startsWith("mặt nước") ? "Lặn xuống mới bắt được cá" : "Không có đàn cá nào trong tầm (≤ 2 m) hoặc đang hồi chiêu";
  return c.startsWith("mặt nước") ? "Không có bông nào sẵn sàng trong tầm, hoặc chưa tới bến" : "Lên mặt nước mới hái / cập bến được";
}
function drawPressLog(w, h) {
  const list = snap.presses || [];
  if (list.length) {
    const last = list[list.length - 1], key = last.tick + "|" + last.text;
    if (key !== lastPressLogged) {
      lastPressLogged = key;
      (last.ok ? console.info : console.warn)("[nút]", last.text);
      if (!last.ok && last.keys && fx.primed && last.mode === snap.mode && snap.tick - last.tick < 60)
        fx.items.push({ text: pressHint(last), color: "#ffab91", born: performance.now() });
    }
  }
  if (!showPressLog || !list.length) return;
  const rows = list.slice(-6), lh = 15, bw = Math.min(760, w - 24), bh = rows.length * lh + 24;
  const x0 = 12, y0 = h - (snap.mode === "gather" ? 70 : 46) - bh;
  ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(x0, y0, bw, bh);
  text("Log nút (L ẩn/hiện)", x0 + 8, y0 + 14, { size: 11, color: "#9fb3c0" });
  rows.forEach((r, i) => {
    let s = r.text; if (s.length > 120) s = s.slice(0, 117) + "…";
    text(s, x0 + 8, y0 + 30 + i * lh, { size: 11, color: r.ok ? "#c8e6c9" : "#ff8a80" });
  });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const now = performance.now(), dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (cut) { drawCutscene(w, h); return; }
  if (snap) {
    fx.ingest();
    if (snap.mode === "quan") { ctx.imageSmoothingEnabled = true; drawQuan(w, h); } else drawGather(w, h);
    fx.draw(w);
    eventLog(w, h);
    drawPressLog(w, h);
    overlay(w, h);
    if (fadeIn > 0) { ctx.fillStyle = `rgba(0,0,0,${fadeIn})`; ctx.fillRect(0, 0, w, h); fadeIn = Math.max(0, fadeIn - dt / 0.9); }
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
