<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" class="char state-idle">
  <style>
    .body-root { transform-origin: 64px 96px; }
    .head { transform-origin: 64px 50px; }
    .arm-l { transform-origin: 41px 60px; }
    .arm-r { transform-origin: 87px 60px; }
    .leg-l { transform-origin: 53px 86px; }
    .leg-r { transform-origin: 75px 86px; }
    .shadow { transform-origin: 64px 117px; }

    /* Idle */
    .state-idle .body-root { animation: idle-bob 1.8s ease-in-out infinite; }
    .state-idle .arm-l { animation: idle-arm 1.8s ease-in-out infinite; }
    .state-idle .arm-r { animation: idle-arm 1.8s ease-in-out infinite reverse; }

    /* Walk */
    .state-walk .body-root { animation: walk-bob 0.45s ease-in-out infinite; }
    .state-walk .leg-l { animation: walk-limb 0.45s ease-in-out infinite; }
    .state-walk .leg-r { animation: walk-limb 0.45s ease-in-out infinite reverse; }
    .state-walk .arm-l { animation: walk-limb 0.45s ease-in-out infinite reverse; }
    .state-walk .arm-r { animation: walk-limb 0.45s ease-in-out infinite; }
    .state-walk .shadow { animation: walk-shadow 0.45s ease-in-out infinite; }

    /* Sit */
    .state-sit .body-root { transform: translateY(7px); animation: sit-bob 2.1s ease-in-out infinite; }
    .state-sit .leg-l, .state-sit .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-sit .arm-l { transform: rotate(-10deg); }
    .state-sit .arm-r { transform: rotate(10deg); }

    /* Eat */
    .state-eat .body-root { transform: translateY(7px); }
    .state-eat .leg-l, .state-eat .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-eat .head { animation: eat-nod 0.55s ease-in-out infinite; }
    .state-eat .arm-r { animation: eat-arm 0.55s ease-in-out infinite; }
    .state-eat .arm-l { transform: rotate(-12deg); }

    /* Impatient */
    .state-impatient .body-root { animation: imp-shake 0.22s linear infinite; }
    .state-impatient .leg-l, .state-impatient .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-impatient .arm-l { transform: rotate(-18deg); }
    .state-impatient .arm-r { transform: rotate(18deg); }

    @keyframes idle-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes idle-arm { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
    @keyframes walk-bob { 0%,100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-4px) rotate(-2deg); } 75% { transform: translateY(-4px) rotate(2deg); } }
    @keyframes walk-limb { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
    @keyframes walk-shadow { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.86); } }
    @keyframes sit-bob { 0%,100% { transform: translateY(7px); } 50% { transform: translateY(5.5px); } }
    @keyframes eat-nod { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(2.5px) rotate(4deg); } }
    @keyframes eat-arm { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(42deg); } }
    @keyframes imp-shake { 0%,100% { transform: translate(-2.5px, 7px); } 50% { transform: translate(2.5px, 7px); } }
  </style>
  <ellipse class="shadow" cx="64" cy="117" rx="24" ry="6" fill="#000" opacity="0.16"/>
  <g class="body-root">
    <g class="leg-l">
      <rect x="46" y="84" width="14" height="24" rx="6" fill="#2B3648" stroke="#1E242B" stroke-width="3"/>
      <ellipse cx="53" cy="111" rx="9" ry="5.5" fill="#F4F6F8" stroke="#1E242B" stroke-width="3"/>
    </g>
    <g class="leg-r">
      <rect x="68" y="84" width="14" height="24" rx="6" fill="#2B3648" stroke="#1E242B" stroke-width="3"/>
      <ellipse cx="75" cy="111" rx="9" ry="5.5" fill="#F4F6F8" stroke="#1E242B" stroke-width="3"/>
    </g>
    <g class="arm-l">
      <path d="M40 58 C27 62 24 76 28 87 C31 92 38 90 39 84 C40 76 42 70 45 67 Z" fill="#F2B98A" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M31 73 Q34 76 31 80 M34 74 Q36 78 33 82" fill="none" stroke="#4A5568" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="27" y="82" width="10" height="4" rx="1.5" fill="#F5C542" stroke="#1E242B" stroke-width="1.5"/>
    </g>
    <g class="arm-r">
      <path d="M88 58 C101 62 104 76 100 87 C97 92 90 90 89 84 C88 76 86 70 83 67 Z" fill="#F2B98A" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M97 73 Q94 76 97 80 M94 74 Q92 78 95 82" fill="none" stroke="#4A5568" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <g class="torso">
      <path d="M42 54 Q64 49 86 54 L94 68 L84 72 L83 89 Q64 92 45 89 L44 72 L34 68 Z" fill="#D92D20" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M52 55 Q64 73 76 55" fill="none" stroke="#F5C542" stroke-width="4" stroke-linecap="round"/>
      <path d="M52 55 Q64 73 76 55" fill="none" stroke="#B7791F" stroke-width="1.5" stroke-dasharray="3 3" stroke-linecap="round"/>
    </g>
    <g class="head">
      <rect x="57" y="48" width="14" height="9" rx="4" fill="#E3A372" stroke="#1E242B" stroke-width="2.5"/>
      <circle cx="42" cy="38" r="5" fill="#F2B98A" stroke="#1E242B" stroke-width="2.5"/>
      <circle cx="86" cy="38" r="5" fill="#F2B98A" stroke="#1E242B" stroke-width="2.5"/>
      <ellipse cx="64" cy="36" rx="21" ry="20" fill="#F7C59F" stroke="#1E242B" stroke-width="3"/>
      <path d="M43 34 C43 24 50 20 64 20 C78 20 85 24 85 34 L82 35 L80 28 L48 28 L46 35 Z" fill="#23272E"/>
      <path d="M42 29 C43 13 53 9 64 9 C75 9 85 13 86 29 Z" fill="#F8FAFC" stroke="#1E242B" stroke-width="3"/>
      <path d="M40 29 Q64 22 89 31 Q64 34 40 29 Z" fill="#E2E8F0" stroke="#1E242B" stroke-width="2.8" stroke-linejoin="round"/>
      <circle cx="64" cy="9.5" r="2.5" fill="#CBD5E1" stroke="#1E242B" stroke-width="2"/>
      <path d="M46 36 Q54 33 61 36 Q61 45 53 45 Q46 45 46 36 Z" fill="#2D3748" stroke="#1E242B" stroke-width="2.5"/>
      <path d="M67 36 Q74 33 82 36 Q82 45 75 45 Q67 45 67 36 Z" fill="#2D3748" stroke="#1E242B" stroke-width="2.5"/>
      <line x1="60" y1="36" x2="68" y2="36" stroke="#1E242B" stroke-width="2.5"/>
      <line x1="49" y1="38" x2="53" y2="42" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="70" y1="38" x2="74" y2="42" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M58 48 Q64 45 70 48" fill="none" stroke="#2D2D2D" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M60 51 Q64 52.5 68 51" fill="none" stroke="#8C5332" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
