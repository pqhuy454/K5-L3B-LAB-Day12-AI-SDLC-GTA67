<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" class="char state-idle">
  <defs>
    <pattern id="polka" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1F2437"/>
      <circle cx="3" cy="3" r="1.4" fill="#F8FAFC"/>
      <circle cx="7" cy="7" r="1.4" fill="#F8FAFC"/>
    </pattern>
  </defs>
  <style>
    .body-root { transform-origin: 64px 96px; }
    .head { transform-origin: 64px 50px; }
    .arm-l { transform-origin: 41px 60px; }
    .arm-r { transform-origin: 87px 60px; }
    .leg-l { transform-origin: 53px 86px; }
    .leg-r { transform-origin: 75px 86px; }
    .shadow { transform-origin: 64px 117px; }

    .state-idle .body-root { animation: idle-bob 1.8s ease-in-out infinite; }
    .state-idle .arm-r { animation: fan-wave 1.2s ease-in-out infinite; }

    .state-walk .body-root { animation: walk-bob 0.45s ease-in-out infinite; }
    .state-walk .leg-l { animation: walk-limb 0.45s ease-in-out infinite; }
    .state-walk .leg-r { animation: walk-limb 0.45s ease-in-out infinite reverse; }
    .state-walk .arm-l { animation: walk-limb 0.45s ease-in-out infinite reverse; }
    .state-walk .arm-r { animation: walk-limb 0.45s ease-in-out infinite; }
    .state-walk .shadow { animation: walk-shadow 0.45s ease-in-out infinite; }

    .state-sit .body-root { transform: translateY(7px); animation: sit-bob 2.1s ease-in-out infinite; }
    .state-sit .leg-l, .state-sit .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-sit .arm-r { animation: fan-wave 1.1s ease-in-out infinite; }

    .state-eat .body-root { transform: translateY(7px); }
    .state-eat .leg-l, .state-eat .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-eat .head { animation: eat-nod 0.55s ease-in-out infinite; }
    .state-eat .arm-r { animation: eat-arm 0.55s ease-in-out infinite; }

    .state-impatient .body-root { animation: imp-shake 0.22s linear infinite; }
    .state-impatient .leg-l, .state-impatient .leg-r { transform: translateY(-6px) scaleY(0.55); }
    .state-impatient .arm-r { animation: fan-wave 0.3s ease-in-out infinite; }

    @keyframes idle-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes fan-wave { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(14deg); } }
    @keyframes walk-bob { 0%,100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-4px) rotate(-2deg); } 75% { transform: translateY(-4px) rotate(2deg); } }
    @keyframes walk-limb { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
    @keyframes walk-shadow { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.86); } }
    @keyframes sit-bob { 0%,100% { transform: translateY(7px); } 50% { transform: translateY(5.5px); } }
    @keyframes eat-nod { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(2.5px) rotate(4deg); } }
    @keyframes eat-arm { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(40deg); } }
    @keyframes imp-shake { 0%,100% { transform: translate(-2.5px, 7px); } 50% { transform: translate(2.5px, 7px); } }
  </style>
  <ellipse class="shadow" cx="64" cy="117" rx="24" ry="6" fill="#000" opacity="0.16"/>
  <g class="body-root">
    <g class="leg-l">
      <rect x="46" y="84" width="14" height="24" rx="6" fill="#181C29" stroke="#1E242B" stroke-width="3"/>
      <ellipse cx="53" cy="111" rx="8.5" ry="5" fill="#7C2D12" stroke="#1E242B" stroke-width="2.8"/>
    </g>
    <g class="leg-r">
      <rect x="68" y="84" width="14" height="24" rx="6" fill="#181C29" stroke="#1E242B" stroke-width="3"/>
      <ellipse cx="75" cy="111" rx="8.5" ry="5" fill="#7C2D12" stroke="#1E242B" stroke-width="2.8"/>
    </g>
    <g class="arm-l">
      <path d="M40 59 C28 63 26 76 30 86 C33 91 39 89 40 83 C41 76 43 70 45 67 Z" fill="#F2B98A" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g class="arm-r">
      <path d="M88 59 C99 63 102 74 98 84 C95 89 89 87 88 81 C87 75 85 70 83 67 Z" fill="#F2B98A" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
      <path d="M97 80 L114 68 A18 18 0 0 1 116 86 Z" fill="#FDE68A" stroke="#1E242B" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="97" y1="80" x2="114" y2="75" stroke="#B45309" stroke-width="1.3"/>
      <line x1="97" y1="80" x2="115" y2="81" stroke="#B45309" stroke-width="1.3"/>
    </g>
    <g class="torso">
      <path d="M42 55 Q64 50 86 55 L93 69 L84 72 L83 90 Q64 93 45 90 L44 72 L35 69 Z" fill="url(#polka)" stroke="#1E242B" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g class="head">
      <circle cx="64" cy="14" r="9.5" fill="#1F242B" stroke="#1E242B" stroke-width="2.8"/>
      <rect x="57" y="19" width="14" height="3.5" rx="1.5" fill="#EF4444" stroke="#1E242B" stroke-width="1.5"/>
      <rect x="57" y="48" width="14" height="9" rx="4" fill="#E3A372" stroke="#1E242B" stroke-width="2.5"/>
      <circle cx="43" cy="39" r="4.5" fill="#F2B98A" stroke="#1E242B" stroke-width="2.5"/>
      <circle cx="85" cy="39" r="4.5" fill="#F2B98A" stroke="#1E242B" stroke-width="2.5"/>
      <ellipse cx="64" cy="38" rx="20.5" ry="19" fill="#F7C59F" stroke="#1E242B" stroke-width="3"/>
      <path d="M44 36 C43 22 52 17 64 17 C76 17 85 22 84 36 C81 28 74 25 64 25 C54 25 47 28 44 36 Z" fill="#1F242B" stroke="#1E242B" stroke-width="2.5"/>
      <path d="M51 35 Q55 33 59 35" fill="none" stroke="#1E242B" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M69 35 Q73 33 77 35" fill="none" stroke="#1E242B" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="55" cy="39.5" r="2.6" fill="#1E242B"/>
      <circle cx="73" cy="39.5" r="2.6" fill="#1E242B"/>
      <circle cx="56" cy="38.7" r="0.9" fill="#FFF"/>
      <circle cx="74" cy="38.7" r="0.9" fill="#FFF"/>
      <ellipse cx="49.5" cy="43.5" rx="3" ry="1.6" fill="#F48FB1" opacity="0.45"/>
      <ellipse cx="78.5" cy="43.5" rx="3" ry="1.6" fill="#F48FB1" opacity="0.45"/>
      <path d="M59 48.5 Q64 47 69 48.5" fill="none" stroke="#8C5332" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
